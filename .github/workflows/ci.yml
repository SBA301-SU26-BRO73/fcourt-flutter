name: CI

on:
  pull_request:
    branches: [main, dev, 'feat/**', 'feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Android debug build takes about 6 minutes and can only break when native or
  # dependency inputs change, so run it only for those PRs. A skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if git diff --name-only "origin/${BASE}...HEAD" | grep -Eq '^(android/|pubspec\.(yaml|lock)$|env/|\.github/(workflows/ci\.yml|scripts/))'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Add placeholder google-services.json
        run: bash .github/scripts/write-ci-google-services.sh
      - name: Build Android debug smoke
        run: bash .github/scripts/build-android-debug.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-smoke
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
